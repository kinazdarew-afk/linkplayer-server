<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления LinkPlayer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #16161a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid #24242b;
        }
        h2 { text-align: center; color: #8a2be2; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaaaaa; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            background-color: #1f1f24;
            border: 1px solid #33333d;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus { border-color: #8a2be2; outline: none; }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #24242b;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: #aaaaaa;
            font-weight: bold;
            transition: 0.3s;
        }
        .tab.active {
            color: #8a2be2;
            border-bottom: 2px solid #8a2be2;
        }
        .hidden { display: none; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #8a2be2, #4a00e0);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
        .success { color: #00ff7f; }
        .error { color: #ff4500; }
    </style>
</head>
<body>

<div class="container">
    <h2>LinkPlayer Activation</h2>
    
    <div class="input-group">
        <label>MAC-адрес / Device ID</label>
        <input type="text" id="macAddress" placeholder="Например: 97:74:D5:6D:68:2E:54:9C" required>
    </div>
    
    <div class="input-group">
        <label>PIN-код активации</label>
        <input type="text" id="pinCode" placeholder="6-значный код с экрана ТВ" required>
    </div>

    <div class="tabs">
        <div class="tab active" id="tabM3u" onclick="switchTab('m3u')">M3U Ссылка</div>
        <div class="tab" id="tabXtream" onclick="switchTab('xtream')">Xtream API</div>
    </div>

    <!-- Форма для M3U -->
    <div id="formM3u" class="input-group">
        <label>Ссылка на плейлист (.m3u / .m3u8)</label>
        <input type="url" id="playlistUrl" placeholder="https://example.com">
    </div>

    <!-- Форма для Xtream Codes -->
    <div id="formXtream" class="hidden">
        <div class="input-group">
            <label>Адрес сервера (Host URL)</label>
            <input type="url" id="xtreamUrl" placeholder="http://provider-dns.com:8080">
        </div>
        <div class="input-group">
            <label>Имя пользователя (Username)</label>
            <input type="text" id="xtreamUser" placeholder="Логин">
        </div>
        <div class="input-group">
            <label>Пароль (Password)</label>
            <input type="password" id="xtreamPass" placeholder="Пароль">
        </div>
    </div>

    <button onclick="submitForm()">Связать устройство</button>
    <div id="message"></div>
</div>

<script>
    let currentMode = 'm3u';

    function switchTab(mode) {
        currentMode = mode;
        if(mode === 'm3u') {
            document.getElementById('tabM3u').classList.add('active');
            document.getElementById('tabXtream').classList.remove('active');
            document.getElementById('formM3u').classList.remove('hidden');
            document.getElementById('formXtream').classList.add('hidden');
        } else {
            document.getElementById('tabM3u').classList.remove('active');
            document.getElementById('tabXtream').classList.add('active');
            document.getElementById('formM3u').classList.add('hidden');
            document.getElementById('formXtream').classList.remove('hidden');
        }
    }

    async function submitForm() {
        const messageDiv = document.getElementById('message');
        messageDiv.className = '';
        messageDiv.innerText = 'Отправка данных...';

        const data = {
            macAddress: document.getElementById('macAddress').value.trim(),
            pinCode: document.getElementById('pinCode').value.trim(),
            isXtream: currentMode === 'xtream'
        };

        if (currentMode === 'm3u') {
            data.playlistUrl = document.getElementById('playlistUrl').value.trim();
        } else {
            data.xtreamUrl = document.getElementById('xtreamUrl').value.trim();
            data.xtreamUser = document.getElementById('xtreamUser').value.trim();
            data.xtreamPass = document.getElementById('xtreamPass').value.trim();
        }

        try {
            const response = await fetch('/api/link-device', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            
            if (response.ok && result.success) {
                messageDiv.className = 'success';
                messageDiv.innerText = 'Устройство успешно связано! Плеер перезапустится автоматичски.';
            } else {
                messageDiv.className = 'error';
                messageDiv.innerText = result.message || 'Ошибка привязки устройства.';
            }
        } catch (error) {
            messageDiv.className = 'error';
            messageDiv.innerText = 'Ошибка подключения к серверу.';
        }
    }
</script>
</body>
</html>
